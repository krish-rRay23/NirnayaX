[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nirnayax"
version = "0.1.0"
description = "NirnayaX — enterprise L1 IT incident triage system (Phase 1: domain + data foundation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "NirnayaX" }]
keywords = ["incident", "triage", "telecom", "oss", "itsm"]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Phase 2 ML engine. Kept optional so the Phase 1 data foundation stays
# pydantic-only; install with `pip install -e ".[ml]"`.
ml = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "joblib>=1.3",
]
# Phase 3 hybrid RAG + incident correlation. Reuses the numpy + scikit-learn
# stack (TF-IDF embeddings + cosine vector search); BM25, fusion, chunking and
# reranking are pure Python. Install with `pip install -e ".[retrieval]"`.
retrieval = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "httpx>=0.27",
]
ui = [
    "streamlit>=1.30",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
nirnayax = "nirnayax.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nirnayax"]

# ---------------------------------------------------------------------------
# Ruff (lint + import sorting)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Content tables carry long, readable template/runbook strings.
"src/nirnayax/data/catalog.py" = ["E501"]
"src/nirnayax/data/runbooks.py" = ["E501"]

# ---------------------------------------------------------------------------
# mypy (static typing)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# scikit-learn / joblib do not ship type information (no py.typed).
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
